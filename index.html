<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jannersten Kart Barkod Okuyucu</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #111;
            color: #fff;
            margin: 0;
            padding: 10px;
        }
        #scanner-container {
            position: relative;
            width: 100%;
            max-width: 380px;
            margin: auto;
            border: 2px solid #444;
            background: #000;
            overflow: hidden;
        }
        video {
            width: 100%;
            display: block;
        }
        /* Tarama kılavuzu */
        #laser-guide {
            position: absolute;
            top: 50%;
            left: 10%;
            width: 80%;
            height: 3px;
            background: #ff3333;
            box-shadow: 0 0 10px #ff3333;
            transform: translateY(-50%);
            pointer-events: none;
        }
        #result-panel {
            margin-top: 15px;
            padding: 12px;
            background: #222;
            border-radius: 6px;
            text-align: left;
            max-width: 356px;
            margin-left: auto;
            margin-right: auto;
            border: 1px solid #333;
        }
        .info-row {
            margin-bottom: 8px;
            font-size: 0.95em;
        }
        .binary-output {
            font-family: monospace;
            word-break: break-all;
            color: #ff9900;
            background: #000;
            padding: 5px;
            display: block;
            margin-top: 2px;
            font-size: 0.85em;
            max-height: 50px;
            overflow-y: auto;
        }
    </style>
</head>
<body>

    <h2>Jannersten Tarayıcı</h2>
    <p>Kartı sabit tutun, şeridi kırmızı çizgiye ortalayın.</p>

    <div id="scanner-container">
        <video id="webcam" autoplay playsinline muted></video>
        <div id="laser-guide"></div>
    </div>

    <canvas id="hidden-canvas" style="display:none;"></canvas>

    <div id="result-panel">
        <div class="info-row"><strong>Durum:</strong> <span id="status" style="color: yellow;">Kamera başlatılıyor...</span></div>
        <div class="info-row"><strong>Kart:</strong> <span id="card-name" style="color: #00ffcc; font-weight: bold;">KART BEKLENİYOR...</span></div>
        <div class="info-row"><strong>Örüntü:</strong> <span id="pattern-code" style="color: #00ff00; font-weight: bold;">-</span></div>
        <div class="info-row"><strong>Ham Model:</strong> <span id="raw-data" class="binary-output">-</span></div>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('hidden-canvas');
        const ctx = canvas.getContext('2d');
        const statusText = document.getElementById('status');
        const cardNameText = document.getElementById('card-name');
        const patternCodeText = document.getElementById('pattern-code');
        const rawDataText = document.getElementById('raw-data');

        // Sabit Tanımlama Haritası (Doğruladıkça buraya işleyebilirsiniz)
        const JANNERSTEN_DECK_MAP = {
            "I-I-I-K-K": "Sinek 8 (8 of Clubs)",
            "I-K-I-I-I": "Karo As (Ace of Diamonds)"
        };

        // Kararlılık sayacı (Hayalet okumaları engellemek için yüksek eşik)
        let lockedCard = "KART BEKLENİYOR...";
        let lockedPattern = "-";
        let matchCount = 0;
        const REQUIRED_MATCHES = 8; // Aynı sonucun üst üste 8 kez gelmesi şartı

        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { exact: "environment" } },
                    audio: false
                });
                video.srcObject = stream;
                statusText.innerText = "Tarama Aktif";
                requestAnimationFrame(processFrame);
            } catch (err) {
                try {
                    const fallbackStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                    video.srcObject = fallbackStream;
                    statusText.innerText = "Test Modu (Ön Kamera)";
                    requestAnimationFrame(processFrame);
                } catch (e) {
                    statusText.innerText = "Kamera Hatası: " + e.message;
                }
            }
        }

        function processFrame() {
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                // Yalnızca orta yatay şeridi tara
                const midY = Math.floor(canvas.height / 2);
                const startX = Math.floor(canvas.width * 0.15);
                const scanLength = Math.floor(canvas.width * 0.7);

                const imgData = ctx.getImageData(startX, midY, scanLength, 1);
                const pixels = imgData.data;

                let binaryString = "";
                let threshold = 115;

                for (let i = 0; i < pixels.length; i += 4) {
                    const brightness = 0.299 * pixels[i] + 0.587 * pixels[i+1] + 0.114 * pixels[i+2];
                    binaryString += (brightness > threshold) ? "1" : "0";
                }

                const compressedData = parseBarPattern(binaryString);
                
                if (compressedData.length > 5) {
                    rawDataText.innerText = compressedData;

                    // Sadece anlamlı siyah çubukları al (Gürültü ve dış boşlukları ele)
                    const blackBars = compressedData.split("-")
                        .filter(p => p.startsWith("B"))
                        .map(b => parseInt(b.replace("B", "")))
                        .filter(w => w >= 3 && w <= 25);

                    // Jannersten standardı: Net 5 adet siyah çubuk beklenir
                    if (blackBars.length === 5) {
                        // Piksel genişliklerini Kalın (K) / İnce (I) olarak ayır
                        const pattern = blackBars.map(w => (w > 8) ? "K" : "I").join("-");
                        
                        const cardFound = JANNERSTEN_DECK_MAP[pattern] || "Tanımlanmamış Kart";

                        // Üst üste kararlılık (Debounce) denetimi
                        if (pattern === lockedPattern) {
                            matchCount++;
                        } else {
                            lockedPattern = pattern;
                            matchCount = 1;
                        }

                        if (matchCount >= REQUIRED_MATCHES) {
                            lockedCard = cardFound;
                            cardNameText.innerText = lockedCard;
                            cardNameText.style.color = (cardFound.includes("Tanımlanmamış")) ? "#ff9900" : "#00ffff";
                            patternCodeText.innerText = lockedPattern;
                        }
                    } else {
                        // Çubuk sayısı tutmazsa sayacı düşür, anlık kaybolmalarda hemen silme
                        matchCount = Math.max(0, matchCount - 1);
                        if (matchCount === 0) {
                            cardNameText.innerText = "KART BEKLENİYOR...";
                            cardNameText.style.color = "#888";
                            patternCodeText.innerText = "-";
                        }
                    }
                }
            }
            requestAnimationFrame(processFrame);
        }

        function parseBarPattern(binaryStr) {
            if (!binaryStr) return "";
            let result = [];
            let currentBit = binaryStr[0];
            let count = 1;

            for (let i = 1; i < binaryStr.length; i++) {
                if (binaryStr[i] === currentBit) {
                    count++;
                } else {
                    const type = (currentBit === "0") ? "B" : "W";
                    if (count > 2) result.push(`${type}${count}`);
                    currentBit = binaryStr[i];
                    count = 1;
                }
            }
            return result.slice(1, -1).join("-");
        }

        window.addEventListener('DOMContentLoaded', startCamera);
    </script>
</body>
</html>
