<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jannersten Kart Barkod Okuyucu</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #222;
            color: #fff;
            margin: 0;
            padding: 10px;
        }
        #scanner-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            margin: auto;
            border: 2px solid #555;
            overflow: hidden;
        }
        video {
            width: 100%;
            display: block;
        }
        #laser-guide {
            position: absolute;
            top: 50%;
            left: 5%;
            width: 90%;
            height: 4px;
            background: red;
            box-shadow: 0 0 8px red;
            transform: translateY(-50%);
        }
        #result-panel {
            margin-top: 15px;
            padding: 10px;
            background: #333;
            border-radius: 5px;
            text-align: left;
            max-width: 380px;
            margin-left: auto;
            margin-right: auto;
        }
        .info-row {
            margin-bottom: 8px;
        }
        .binary-output {
            font-family: monospace;
            word-break: break-all;
            color: #00ff00;
            background: #111;
            padding: 4px;
            display: block;
            margin-top: 2px;
        }
        .raw-output {
            color: #ff9900;
        }
    </style>
</head>
<body>

    <h2>Jannersten Barkod Tarayıcı (v3 - Kararlı)</h2>
    <p>Kartı kırmızı çizgiye yaklaştırın ve 1 saniye sabit tutun.</p>

    <div id="scanner-container">
        <video id="webcam" autoplay playsinline muted></video>
        <div id="laser-guide"></div>
    </div>

    <canvas id="hidden-canvas" style="display:none;"></canvas>

    <div id="result-panel">
        <div class="info-row"><strong>Durum:</strong> <span id="status">Kamera başlatılıyor...</span></div>
        <div class="info-row"><strong>Tespit Edilen Kart:</strong> <span id="card-name" style="color: #00ffff; font-weight: bold; font-size: 1.2em;">KART BEKLENİYOR...</span></div>
        <div class="info-row"><strong>Çözümlenen Örüntü:</strong> <span id="pattern-code" style="color: #00ff00; font-weight: bold;">-</span></div>
        <div class="info-row"><strong>Ham Çizgi Modeli:</strong> <span id="raw-data" class="binary-output raw-output">-</span></div>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('hidden-canvas');
        const ctx = canvas.getContext('2d');
        const statusText = document.getElementById('status');
        const cardNameText = document.getElementById('card-name');
        const patternCodeText = document.getElementById('pattern-code');
        const rawDataText = document.getElementById('raw-data');

        // 1. Jannersten 5 Çubuklu Sabit Örüntü Haritası
        // İnce çubuklar = I, Kalın çubuklar = K
        const JANNERSTEN_DECK_MAP = {
            "I-K-I-I-I": "Karo As (Ace of Diamonds)",   // Gönderdiğiniz: B4-B10-B5-B5-B5 kalıbı (İlk B4 gürültü olabilir, ana gövde kilitlenir)
            "I-I-I-K-K": "Sinek 8 (8 of Clubs)",        // Gönderdiğiniz: ...B5-B11-B10 kalıbı
            
            // Kartları keşfettikçe buraya ekleyeceksiniz. Örn:
            // "K-I-I-I-I": "Kupa Kızı",
        };

        // Kararlılık kontrolü için değişkenler
        let patternHistory = [];
        const HISTORY_LIMIT = 5; // Aynı örüntü üst üste kaç kare okunursa kart kabul edilsin?

        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: { exact: "environment" } },
                    audio: false
                });
                video.srcObject = stream;
                statusText.innerText = "Tarama Aktif...";
                requestAnimationFrame(processFrame);
            } catch (err) {
                try {
                    const fallbackStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                    video.srcObject = fallbackStream;
                    statusText.innerText = "Ön Kamera Aktif (Test Modu)...";
                    requestAnimationFrame(processFrame);
                } catch (e) {
                    statusText.innerText = "Kamera erişim hatası: " + e.message;
                }
            }
        }

        function processFrame() {
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                const midY = Math.floor(canvas.height / 2);
                const startX = Math.floor(canvas.width * 0.1);
                const scanLength = Math.floor(canvas.width * 0.8);

                const imgData = ctx.getImageData(startX, midY, scanLength, 1);
                const pixels = imgData.data;

                let binaryString = "";
                let threshold = 110; // Kontrastı artırmak için eşik değeri hafif düşürüldü

                for (let i = 0; i < pixels.length; i += 4) {
                    const r = pixels[i];
                    const g = pixels[i+1];
                    const b = pixels[i+2];
                    const brightness = 0.299 * r + 0.587 * g + 0.114 * b;
                    binaryString += (brightness > threshold) ? "1" : "0";
                }

                const compressedData = parseBarPattern(binaryString);
                
                if (compressedData.length > 3) {
                    rawDataText.innerText = compressedData;

                    // 1. Aşama: Sadece siyah çubukları ayıkla ve temizle
                    const parts = compressedData.split("-");
                    const blackBars = parts
                        .filter(p => p.startsWith("B"))
                        .map(b => parseInt(b.replace("B", "")))
                        .filter(width => width > 2 && width < 30); // Parazitleri temizle

                    // Jannersten kartı doğrulama filtresi: Ekranda gürültüler hariç 4 ila 6 çubuk olmalı
                    if (blackBars.length >= 4 && blackBars.length <= 6) {
                        
                        // 2. Aşama: Titremeyi önleyen sabit oranlama (Sayıları Harfe Çevirme)
                        // Gönderdiğiniz verilere göre: B3, B4, B5, B6 = İnce (I) | B9, B10, B11, B12 = Kalın (K)
                        // Sınır çizgimizi sabit 7 piksel olarak belirliyoruz.
                        const patternArray = blackBars.map(w => (w > 7) ? "K" : "I");
                        const currentPattern = patternArray.join("-");

                        patternCodeText.innerText = currentPattern; // Ekranda harf halini gösterir (Örn: I-K-I-I-I)

                        // 3. Aşama: Kararlılık Kontrolü (Debounce)
                        // Kart yokken veya el çok titrerken anlık yanlış okumaları engeller
                        patternHistory.push(currentPattern);
                        if (patternHistory.length > HISTORY_LIMIT) {
                            patternHistory.shift();
                        }

                        // Eğer son 5 kare boyunca hep aynı harf dizilimi okunduysa kartı kesinleştir
                        const allSame = patternHistory.every(p => p === currentPattern);
                        if (allSame) {
                            if (JANNERSTEN_DECK_MAP[currentPattern]) {
                                cardNameText.innerText = JANNERSTEN_DECK_MAP[currentPattern];
                                cardNameText.style.color = "#00ffff";
                            } else {
                                cardNameText.innerText = "Tanımlanmamış Kart";
                                cardNameText.style.color = "#ff9900";
                            }
                        }
                    } else {
                        // Eğer ekranda barkod benzeri net çubuklar yoksa paneli temizle veya beklemede tut
                        // Böylece kart kamerada yokken eski kartın yazısı kalmaz veya rastgele tetiklenmez.
                        if (patternHistory.length > 0) {
                            patternHistory.shift(); 
                        }
                        if (patternHistory.length === 0) {
                            cardNameText.innerText = "KART BEKLENİYOR...";
                            cardNameText.style.color = "#aaaaaa";
                            patternCodeText.innerText = "-";
                        }
                    }
                }
            }
            requestAnimationFrame(processFrame);
        }

        function parseBarPattern(binaryStr) {
            if (!binaryStr) return "";
            let result = [];
            let currentBit = binaryStr[0];
            let count = 1;

            for (let i = 1; i < binaryStr.length; i++) {
                if (binaryStr[i] === currentBit) {
                    count++;
                } else {
                    const type = (currentBit === "0") ? "B" : "W"; 
                    if (count > 2) { 
                        result.push(`${type}${count}`);
                    }
                    currentBit = binaryStr[i];
                    count = 1;
                }
            }
            return result.slice(2, -2).join("-"); 
        }

        window.addEventListener('DOMContentLoaded', startCamera);
    </script>
</body>
</html>
