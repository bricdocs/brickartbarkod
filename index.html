<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jannersten Kart Barkod Okuyucu - v3.8 (Üstten Başlayan Geniş Alan)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #111;
            color: #fff;
            margin: 0;
            padding: 10px;
        }
        #scanner-container {
            position: relative;
            width: 100%;
            max-width: 380px;
            margin: auto;
            border: 2px solid #444;
            background: #000;
            overflow: hidden;
        }
        video {
            width: 100%;
            display: block;
        }
        /* Kameranın üst sınırından yaklaşık 1-2 cm (18px) aşağıdan başlayıp aşağı uzanan geniş alan kılavuzu */
        #laser-guide {
            position: absolute;
            top: 25px; /* Üst sınırdan 1-2 cm aşağıda başlar */
            left: 10%;
            width: 80%;
            height: 200px; /* Alan alt bölgeye doğru iyice büyütüldü */
            border-top: 2px solid #ff3333;
            border-bottom: 2px dashed #ff3333;
            background: rgba(255, 51, 51, 0.1);
            box-shadow: 0 0 12px rgba(255, 51, 51, 0.4);
            pointer-events: none;
        }
        #result-panel {
            margin-top: 15px;
            padding: 12px;
            background: #222;
            border-radius: 6px;
            text-align: left;
            max-width: 356px;
            margin-left: auto;
            margin-right: auto;
            border: 1px solid #333;
        }
        .info-row {
            margin-bottom: 8px;
            font-size: 0.95em;
        }
        .binary-output {
            font-family: monospace;
            word-break: break-all;
            color: #ff9900;
            background: #000;
            padding: 5px;
            display: block;
            margin-top: 2px;
            font-size: 0.85em;
            max-height: 50px;
            overflow-y: auto;
        }
        .btn-group {
            margin-top: 10px;
            display: flex;
            justify-content: center;
            gap: 10px;
            max-width: 380px;
            margin-left: auto;
            margin-right: auto;
        }
        .action-btn {
            padding: 8px 14px;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }
        #switch-camera-btn { background: #ff9900; color: #111; }
        #clear-history-btn { background: #cc3333; color: #fff; }
        
        #history-panel {
            margin-top: 15px;
            padding: 10px;
            background: #1a1a1a;
            border-radius: 6px;
            border: 1px solid #333;
            max-width: 356px;
            margin-left: auto;
            margin-right: auto;
            text-align: left;
            max-height: 150px;
            overflow-y: auto;
        }
        #history-list {
            list-style-type: none;
            padding: 0;
            margin: 5px 0 0 0;
            font-size: 0.85em;
            font-family: monospace;
        }
        #history-list li {
            padding: 4px 6px;
            border-bottom: 1px solid #282828;
            display: flex;
            justify-content: space-between;
        }
        #history-list li span.card { color: #00ffcc; }
        #history-list li span.pattern { color: #888; font-size: 0.9em; }
    </style>
    <script src="barkod-data.js"></script>
</head>
<body>

    <h2>Jannersten Tarayıcı (Üst Referanslı Geniş Alan)</h2>
    <p>Telefonun üst kısmını baz alarak kartı yukarı bölgeye yaklaştırın.</p>

    <div id="scanner-container">
        <video id="webcam" autoplay playsinline muted></video>
        <div id="laser-guide"></div>
    </div>
    
    <div class="btn-group">
        <button id="switch-camera-btn" class="action-btn" onclick="switchCamera()">Kamera Değiştir</button>
        <button id="clear-history-btn" class="action-btn" onclick="clearHistory()">Listeyi Temizle</button>
    </div>

    <canvas id="hidden-canvas" style="display:none;"></canvas>

    <div id="result-panel">
        <div class="info-row"><strong>Durum:</strong> <span id="status" style="color: yellow;">Kamera başlatılıyor...</span></div>
        <div class="info-row"><strong>Kart:</strong> <span id="card-name" style="color: #00ffcc; font-weight: bold; font-size: 1.2em;">KART BEKLENİYOR...</span></div>
        <div class="info-row"><strong>Örüntü:</strong> <span id="pattern-code" style="color: #00ff00; font-weight: bold;">-</span></div>
        <div class="info-row"><strong>Ham Model:</strong> <span id="raw-data" class="binary-output">-</span></div>
    </div>

    <div id="history-panel">
        <strong>Okunan Tanımlı Kartlar Geçmişi:</strong>
        <ul id="history-list">
            <li style="color: #666; text-align: center;">Henüz bilinen kart okunmadı</li>
        </ul>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('hidden-canvas');
        const ctx = canvas.getContext('2d');
        const statusText = document.getElementById('status');
        const cardNameText = document.getElementById('card-name');
        const patternCodeText = document.getElementById('pattern-code');
        const rawDataText = document.getElementById('raw-data');
        const historyList = document.getElementById('history-list');

        let lockedPattern = "-";
        let matchCount = 0;
        const REQUIRED_MATCHES = 3; 
        
        let currentFacingMode = "environment";
        let currentStream = null;
        let lastLoggedCard = "";

        let audioCtx = null;
        function playBeep() {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(950, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.18);
            } catch (e) {
                console.log("Ses çalınamadı: ", e);
            }
        }

        function addHistoryItem(cardName, pattern) {
            if (cardName === lastLoggedCard) return;
            lastLoggedCard = cardName;

            if (historyList.querySelector('li[style*="center"]')) {
                historyList.innerHTML = "";
            }

            const li = document.createElement('li');
            li.innerHTML = `<span class="card">${cardName}</span> <span class="pattern">[${pattern}]</span>`;
            historyList.prepend(li);
            playBeep();
        }

        function clearHistory() {
            historyList.innerHTML = '<li style="color: #666; text-align: center;">Henüz bilinen kart okunmadı</li>';
            lastLoggedCard = "";
        }

        async function startCamera() {
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
            }
            try {
                const constraints = {
                    video: { facingMode: { exact: currentFacingMode } },
                    audio: false
                };
                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                handleStream(stream, `Tarama Aktif (${currentFacingMode === "environment" ? "Arka" : "Ön"} Kamera)`);
            } catch (err) {
                try {
                    const fallbackStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: currentFacingMode }, audio: false });
                    handleStream(fallbackStream, `Tarama Aktif (${currentFacingMode === "environment" ? "Arka" : "Ön"} Alternatif)`);
                } catch (e) {
                    try {
                        const basicStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                        handleStream(basicStream, "Test Modu (Genel Kamera)");
                    } catch (ex) {
                        statusText.innerText = "Kamera Hatası: " + ex.message;
                    }
                }
            }
        }

        function handleStream(stream, statusMsg) {
            currentStream = stream;
            video.srcObject = stream;
            statusText.innerText = statusMsg;
            requestAnimationFrame(processFrame);
        }

        function switchCamera() {
            currentFacingMode = (currentFacingMode === "environment") ? "user" : "environment";
            startCamera();
        }

        function processFrame() {
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                const startX = Math.floor(canvas.width * 0.15);
                const scanLength = Math.floor(canvas.width * 0.7);

                // GÜNCELLEME: Tarama alanını üst sınırdan (canvas yüksekliğinin %5'i kadar) başlatıp 200 piksel aşağı tarıyoruz
                const startY = Math.floor(canvas.height * 0.05); 
                const scanHeight = 200;

                const imgData = ctx.getImageData(startX, startY, scanLength, scanHeight);
                const pixels = imgData.data;

                let threshold = 115;
                let validPatternFound = false;

                for (let y = 0; y < scanHeight; y++) {
                    let binaryString = "";
                    const rowOffset = y * scanLength * 4;

                    for (let x = 0; x < scanLength; x++) {
                        const i = rowOffset + (x * 4);
                        const brightness = 0.299 * pixels[i] + 0.587 * pixels[i+1] + 0.114 * pixels[i+2];
                        binaryString += (brightness > threshold) ? "1" : "0";
                    }

                    const compressedData = parseBarPattern(binaryString);
                    
                    if (compressedData.length > 3) {
                        const parts = compressedData.split("-").filter(p => {
                            const val = parseInt(p.substring(1));
                            return val >= 2 && val <= 35;
                        });

                        if (parts.length >= 9) {
                            const targetSequence = parts.slice(-9);
                            const blacks = targetSequence.filter(p => p.startsWith("B")).map(p => parseInt(p.substring(1)));
                            const whites = targetSequence.filter(p => p.startsWith("W")).map(p => parseInt(p.substring(1)));

                            if (blacks.length >= 4) {
                                const avgBlack = blacks.reduce((a, b) => a + b, 0) / blacks.length;
                                const avgWhite = whites.reduce((a, b) => a + b, 0) / whites.length;

                                const pattern = targetSequence.map(p => {
                                    const val = parseInt(p.substring(1));
                                    if (p.startsWith("B")) {
                                        return (val > 7) ? "K" : "I"; 
                                    } else {
                                        return (val > avgWhite) ? "G" : "D"; 
                                    }
                                }).join("-");

                                rawDataText.innerText = compressedData;
                                
                                const isDefined = (typeof JANNERSTEN_DECK_MAP !== 'undefined' && JANNERSTEN_DECK_MAP[pattern]);
                                const cardFound = isDefined ? JANNERSTEN_DECK_MAP[pattern] : "Tanımlanmamış Örüntü: " + pattern;

                                if (pattern === lockedPattern) {
                                    matchCount++;
                                } else {
                                    lockedPattern = pattern;
                                    matchCount = 1;
                                }

                                if (matchCount >= REQUIRED_MATCHES) {
                                    cardNameText.innerText = cardFound;
                                    cardNameText.style.color = isDefined ? "#00ffff" : "#ff9900";
                                    patternCodeText.innerText = lockedPattern;
                                    
                                    if (isDefined) {
                                        addHistoryItem(cardFound, lockedPattern);
                                    }
                                }
                                
                                validPatternFound = true;
                                break; 
                            }
                        }
                    }
                }

                if (!validPatternFound) {
                    resetScannerPanel();
                }
            }
            requestAnimationFrame(processFrame);
        }

        function resetScannerPanel() {
            matchCount = Math.max(0, matchCount - 1);
            if (matchCount === 0) {
                cardNameText.innerText = "KART BEKLENİYOR...";
                cardNameText.style.color = "#888";
                patternCodeText.innerText = "-";
                lastLoggedCard = "";
            }
        }

        function parseBarPattern(binaryStr) {
            if (!binaryStr) return "";
            let result = [];
            let currentBit = binaryStr;
            let count = 1;

            for (let i = 1; i < binaryStr.length; i++) {
                if (binaryStr[i] === currentBit) {
                    count++;
                } else {
                    const type = (currentBit === "0") ? "B" : "W";
                    if (count > 2) result.push(`${type}${count}`);
                    currentBit = binaryStr[i];
                    count = 1;
                }
            }
            return result.slice(1, -1).join("-");
        }

        window.addEventListener('DOMContentLoaded', startCamera);
    </script>
</body>
</html>
